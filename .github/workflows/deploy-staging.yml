name: Deploy to Staging (Optimized)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    name: Build Frontend & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código en el servidor de GitHub
      # Obtiene la última versión del repositorio de la rama 'develop'
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Preparar el entorno Node.js en GitHub
      # Configura Node para compilar los assets del frontend sin consumir la RAM del VPS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Ajusta a la versión que uses localmente

      # 3. Compilar Vite usando los recursos de GitHub
      # Instala las dependencias NPM y construye los archivos estáticos de React/Vue/CSS listos para producción
      - name: Compilar Assets (En GitHub)
        run: |
          npm ci
          npm run build

      # 4. Sincronizar el Backend de Laravel en el VPS
      # Se conecta por SSH, pone el sitio en mantenimiento, trae los cambios de Git y actualiza Composer
      - name: Sincronizar Backend en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          script: |
            cd /var/www/server.johnbecerra.dev
            
            # Poner el sitio en modo mantenimiento
            php artisan down --message="Actualizando entorno..."
            
            # Traer los cambios
            git fetch origin
            
            # Se hace un reseteo duro para igualar la rama y borrar modificaciones locales accidentales
            git reset --hard origin/develop
            
            # Instalar dependencias de PHP optimizadas para producción
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      # 5. Transferir silenciosamente la compilación terminada al VPS
      # Copia la carpeta public/build generada en el paso 3 directamente al servidor web
      - name: Transferir Build Frontend al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          source: "public/build"
          target: "/var/www/server.johnbecerra.dev"

      # 6. Ejecutar migraciones, configurar permisos y encender la aplicación
      # Aplica cambios a la BD, limpia caché, enlaza el storage de imágenes y restaura permisos al grupo www-data
      - name: Finalizar Despliegue en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT }}
          script: |
            cd /var/www/server.johnbecerra.dev
            
            # 1. Ejecutar nuevas migraciones de base de datos sin preguntar
            php artisan migrate --force
            
            # 2. Limpiar y regenerar la caché de configuración, rutas y vistas
            php artisan optimize:clear
            
            # 3. MANTENIMIENTO DE IMÁGENES Y PERMISOS 
            # Crear enlace simbólico para que las imágenes sean visibles (falla silenciosamente con '|| true' si ya existe)
            php artisan storage:link || true
            
            # Devolver los permisos de escritura a Laravel/Nginx sobre la carpeta storage sin requerir sudo
            chmod -R 775 storage bootstrap/cache
            
            # 4. Levantar la aplicación para que vuelva a estar en línea
            php artisan up
            
            echo "Despliegue finalizado usando recursos optimizados y permisos restaurados."